<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23521510'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle'%3E%F0%9F%8C%AF%3C/text%3E%3C/svg%3E">
<title>Shawarma Thief – The Grill Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<script>window.GRILL_CONFIG = { backend: "server", apiBase: "/api" };</script>
<style>
:root{
  --maroon:#521510;--maroon-deep:#3a0e0a;--cream:#e6d6c5;
  --bg:#521510;--page:#f3e9dd;--panel:#f3e9dd;--panel-2:#e6d6c5;
  --ink:#3a0e0a;--muted:#7d5a4f;--line:rgba(82,21,16,.16);
  --btn:#521510;--btn-ink:#f3e9dd;--gold:#f2c230;--ok:#2e7d32;--bad:#c62828;
  --slot:var(--panel);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;--bg:#2a0b08;--page:#1f0a08;--panel:#2c0f0b;--panel-2:#3d1712;
    --ink:#f2e4d4;--muted:#c9ab9c;--line:rgba(242,228,212,.14);--btn:#e6d6c5;--btn-ink:#3a0e0a;--ok:#81c784;--bad:#ef9a9a;
  }
  :root:not([data-theme="light"]) .mark,:root:not([data-theme="light"]) .wm{color:#e6d6c5;}
  :root:not([data-theme="light"]) .ticket{border-color:#e6d6c5;}
}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#2a0b08;--page:#1f0a08;--panel:#2c0f0b;--panel-2:#3d1712;
  --ink:#f2e4d4;--muted:#c9ab9c;--line:rgba(242,228,212,.14);--btn:#e6d6c5;--btn-ink:#3a0e0a;--ok:#81c784;--bad:#ef9a9a;
}
:root[data-theme="dark"] .mark,:root[data-theme="dark"] .wm{color:#e6d6c5;}
:root[data-theme="dark"] .ticket{border-color:#e6d6c5;}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);}
body{font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;}
[hidden]{display:none!important;}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;}
.mark{display:block;color:var(--maroon);}
.mark .s{fill:var(--slot);}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;pointer-events:none;color:#fff;font-weight:700;-webkit-user-select:none;user-select:none;}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:6px;}
.pill{background:rgba(58,14,10,.62);border-radius:999px;padding:3px 12px;font-size:19px;line-height:1.4;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.pill .of{font-size:12px;opacity:.75;font-weight:500;}
.ci{width:16px;height:16px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffcc33 50%,#d4930a);}
.hudlogo{background:rgba(243,233,221,.94);border-radius:999px;padding:4px 10px 4px 6px;display:flex;align-items:center;gap:5px;--slot:#f3e9dd;}
.hudlogo .mark{width:22px;height:22px;color:var(--maroon)!important;}
.hudlogo span{color:var(--maroon);font-weight:800;font-size:12px;line-height:1;}
#journey{position:relative;height:8px;margin:9px 6px 0;border-radius:4px;background:rgba(58,14,10,.5);--tick:10%;}
#journey::after{content:"";position:absolute;top:0;bottom:0;left:0;right:0;border-radius:4px;background:repeating-linear-gradient(90deg,transparent 0 calc(var(--tick) - 2px),rgba(243,233,221,.75) calc(var(--tick) - 2px) var(--tick));}
#jfill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gold);border-radius:4px;}
#jcat{position:absolute;top:50%;left:0;transform:translate(-50%,-55%);font-size:17px;line-height:1;z-index:1;}
.hrow.small{margin-top:7px;align-items:flex-start;}
#lifebox{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.heart{font-size:22px;line-height:1;color:#ff4d61;text-shadow:0 2px 0 rgba(0,0,0,.35);}
.heart.off{color:rgba(255,255,255,.35);}
.shieldic{font-size:18px;}
.pu{display:flex;align-items:center;gap:4px;background:rgba(58,14,10,.62);border-radius:999px;padding:2px 9px 2px 5px;font-size:14px;}
.pu i{display:block;width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden;}
.pu i b{display:block;height:100%;background:var(--gold);}
#mute{pointer-events:auto;touch-action:manipulation;width:36px;height:36px;border-radius:50%;border:0;background:rgba(58,14,10,.55);color:#fff;font-size:17px;padding:0;}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 108px);transform:translateX(-50%);background:var(--maroon);color:#f3e9dd;border:2px solid var(--gold);border-radius:16px;padding:8px 16px;font-weight:700;font-size:16px;text-align:center;max-width:88vw;pointer-events:none;box-shadow:0 6px 0 rgba(0,0,0,.2);}
#scard{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 104px);transform:translate(-50%,-24px);opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;text-align:center;background:var(--maroon);color:#f3e9dd;border:2px solid var(--gold);border-radius:18px;padding:7px 20px 9px;white-space:nowrap;}
#scard.on{opacity:1;transform:translate(-50%,0);}
#scard small{display:block;font-size:11px;letter-spacing:.12em;font-weight:700;opacity:.85;}
#scard b{display:block;font-size:25px;font-weight:800;line-height:1.1;}
#scard span{font-size:13px;color:var(--gold);font-weight:700;}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:44px;font-weight:800;color:#ffd54f;text-shadow:0 3px 0 #521510,0 0 14px rgba(0,0,0,.35);pointer-events:none;opacity:0;letter-spacing:-.01em;}
#banner.on{animation:pop 1.7s ease-out forwards;}
@keyframes pop{0%{opacity:0;transform:scale(.6)}14%{opacity:1;transform:scale(1.08)}28%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
#flash{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s;}
#flash.on{opacity:.85;transition:none;}
#ctl{position:fixed;bottom:0;left:0;right:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;justify-content:space-between;pointer-events:none;}
#ctl button{pointer-events:auto;touch-action:manipulation;width:62px;height:62px;border-radius:50%;border:2px solid rgba(243,233,221,.7);background:rgba(58,14,10,.45);color:#f3e9dd;font-size:24px;font-family:inherit;}
#ctl button:active{background:rgba(58,14,10,.7);}

/* overlay card */
#ov{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:rgba(40,10,7,.42);overflow-y:auto;}
.card{background:var(--panel);color:var(--ink);border-radius:26px;padding:20px 20px 16px;width:100%;max-width:360px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.22);margin:auto;}
.card{--panel:#ffffff;--panel-2:#f4efea;--ink:#1f1612;--muted:#6b5a52;--line:rgba(31,22,18,.14);--btn:#521510;--btn-ink:#ffffff;--ok:#2e7d32;--bad:#c62828;--slot:#ffffff;color-scheme:light;}
.card .mark,.card .wm{color:#521510!important;}
.card .ticket{border-color:#521510!important;}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;}
.brand .mark{width:40px;height:40px;}
.wm{display:flex;flex-direction:column;align-items:flex-end;line-height:.9;color:var(--maroon);}
.wm b{font-size:26px;font-weight:800;letter-spacing:-.02em;}
.wm small{font-size:12px;font-weight:700;letter-spacing:.04em;}
.card h1{margin:4px 0 2px;font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.02em;}
.card .sub{margin:0 0 14px;color:var(--muted);font-size:16px;line-height:1.35;}
.offer,.stats{display:flex;gap:8px;margin:0 0 12px;}
.offer div,.stats div{flex:1;background:var(--panel-2);border-radius:16px;padding:8px 6px 6px;}
.offer b,.stats b{display:block;font-size:23px;line-height:1.1;font-weight:800;}
.offer span,.stats span{font-size:13px;color:var(--muted);}
.tiers{display:flex;gap:6px;margin:0 0 12px;}
.tiers div{flex:1;background:var(--panel-2);border-radius:14px;padding:7px 4px 6px;}
.tiers b{display:block;font-size:19px;line-height:1.1;font-weight:800;}
.tiers span{display:block;font-size:13px;font-weight:700;line-height:1.2;margin-top:2px;}
.tiers em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:2px;}
.tedit{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:8px;align-items:end;margin-bottom:8px;}
.tedit label{margin:0;}
.rule{font-size:15px;line-height:1.4;margin:0 0 14px;color:var(--ink);}
.howto{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.45;text-align:left;}
.primary{width:100%;border:0;border-radius:999px;background:var(--btn);color:var(--btn-ink);font:800 20px/1 'Outfit',system-ui,sans-serif;padding:15px 0 14px;cursor:pointer;}
.primary:active{transform:translateY(2px);}
.secondary{width:100%;border:2px solid var(--btn);border-radius:999px;background:transparent;color:var(--ink);font:800 17px/1 'Outfit',system-ui,sans-serif;padding:12px 0 11px;cursor:pointer;margin-top:8px;}
.primary:focus-visible,.secondary:focus-visible,.link:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
.link{background:none;border:0;color:var(--ink);font:700 15px 'Outfit',system-ui,sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px;}
.row2{display:flex;justify-content:center;gap:18px;margin-top:8px;flex-wrap:wrap;}
.toggles{display:flex;justify-content:center;gap:4px;margin-top:2px;flex-wrap:wrap;}
.toggles .link{font-size:13px;font-weight:600;color:var(--muted);}
.me{font-size:15px;margin:0 0 10px;}
form label{display:block;text-align:left;font-size:14px;font-weight:700;margin:0 0 10px;}
form input{display:block;width:100%;margin-top:4px;font:500 16px 'Outfit',system-ui,sans-serif;color:var(--ink);background:var(--panel-2);border:2px solid transparent;border-radius:12px;padding:11px 12px;}
.err{color:var(--bad);font-size:14px;margin:0 0 10px;text-align:left;}
.fine{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.4;}
.ticket{border:2px dashed var(--maroon);border-radius:16px;padding:12px;margin:0 0 14px;background:rgba(242,194,48,.16);}
.ticket span{display:block;font-size:13px;font-weight:700;color:var(--muted);}
.ticket b{display:block;font-size:28px;font-weight:800;letter-spacing:.06em;margin:2px 0;}
.ticket small{display:block;font-size:13px;line-height:1.35;}
.clist{list-style:none;padding:0;margin:0 0 14px;text-align:left;}
.clist li{background:var(--panel-2);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;}
.clist b{font-size:17px;letter-spacing:.04em;}
.clist small{display:block;color:var(--muted);font-size:12px;}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;}
.tag.on{background:rgba(46,125,50,.16);color:var(--ok);}
.tag.off{background:var(--line);color:var(--muted);}
.tag.warn{background:rgba(198,40,40,.14);color:var(--bad);}
.tabs{display:flex;gap:8px;justify-content:center;margin:0 0 12px;}
.tabs button{font:700 14px 'Outfit',system-ui,sans-serif;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:7px 18px;cursor:pointer;}
.tabs button.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn);}
.board{list-style:none;padding:0;margin:0 0 10px;text-align:left;}
.board li{display:flex;align-items:center;gap:10px;background:var(--panel-2);border-radius:14px;padding:9px 12px;margin-bottom:6px;}
.board .rk{min-width:28px;text-align:center;font-weight:800;}
.board .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.board .pt{font-weight:800;font-variant-numeric:tabular-nums;}
.board li.me{outline:2px solid var(--gold);}
.live{font-size:12px;color:var(--muted);margin:0 0 10px;}
.live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pulse 1.6s infinite;}
@keyframes pulse{50%{opacity:.25;}}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;margin:8px auto;}
@keyframes sp{to{transform:rotate(360deg)}}

/* admin */
#admin{position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto;background:var(--page);color:var(--ink);padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 32px);--slot:var(--page);}
.adm{max-width:980px;margin:0 auto;}
.adm-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;flex-wrap:wrap;}
.adm-head .brand{margin:0;justify-content:flex-start;}
.adm h2{font-size:24px;margin:18px 0 8px;font-weight:800;letter-spacing:-.01em;}
.adm h3{font-size:18px;margin:22px 0 8px;font-weight:700;}
.note{background:rgba(242,194,48,.18);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4;margin:10px 0 0;}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px;}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;}
.tile b{display:block;font-size:26px;font-weight:800;line-height:1.1;}
.tile span{font-size:13px;color:var(--muted);}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:600px;}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:12px;color:var(--muted);font-weight:700;}
tr:last-child td{border-bottom:0;}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;}
.small-btn{font:700 13px 'Outfit',system-ui,sans-serif;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:5px 12px;cursor:pointer;}
.set{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;}
.set label{margin:0;flex:1;min-width:120px;}
.set .primary{width:auto;padding:12px 22px;font-size:16px;}
.adm-gate{max-width:340px;margin:12vh auto 0;text-align:center;background:var(--panel);border-radius:22px;padding:22px;border:1px solid var(--line);--slot:var(--panel);}
.adm-gate .mark{width:56px;height:56px;margin:0 auto 8px;}
.adm-gate h2{margin:0 0 14px;}
.danger{color:var(--bad);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" hidden>
  <div class="hrow">
    <div class="pill"><b id="pts">0</b><span class="of" id="ptsT">pts</span></div>
    <div class="hudlogo" id="hudlogo"></div>
    <div class="pill"><span class="ci"></span><span id="coinN">0</span></div>
  </div>
  <div id="journey"><i id="jfill"></i><span id="jcat">🐈</span></div>
  <div class="hrow small">
    <div id="lifebox"><span id="heart" class="heart off" aria-label="Extra life">♥</span><span id="pus"></span></div>
    <button id="mute" aria-label="Sound on or off">🔊</button>
  </div>
</div>
<div id="flash"></div>
<div id="scard"><small>THE GRILL CAFE WELCOMES YOU TO</small><b id="scName"></b><span id="scSub"></span></div>
<div id="banner"></div>
<div id="toast" hidden></div>
<div id="ctl" hidden>
  <button id="bSlide" aria-label="Slide">▼</button>
  <button id="bJump" aria-label="Jump">▲</button>
</div>
<div id="ov"><div class="card" id="card"></div></div>
<div id="admin" hidden></div>
<script>

(() => {
'use strict';
/* =====================================================================
   CONFIG — backend: 'mock' keeps everything in this browser (test mode).
   backend: 'server' talks to the Neon-backed API at apiBase (Vercel).
   Set it before this script with: window.GRILL_CONFIG = { backend: 'server' }
   ===================================================================== */
const CONFIG = Object.assign({ backend: 'mock', apiBase: '/api' }, window.GRILL_CONFIG || {});
const TAU = Math.PI * 2, LANE = 1.2, PZ = 3, GRAV = 24, FOGZ = 30;
const MAROON = '#521510', CREAM = '#e6d6c5', GOLD = '#f2c230';

const MARK = '<svg class="mark" viewBox="0 0 100 100" aria-hidden="true">' +
  '<path d="M64 16H50A36 36 0 1 0 86 52" fill="none" stroke="currentColor" stroke-width="9"/>' +
  '<path d="M14 38Q50 34 88 40L86 58Q50 62 16 56Z" fill="currentColor"/>' +
  [0, 1, 2, 3, 4, 5, 6].map(i => { const x = 22 + i * 9.6; return '<path class="s" d="M' + (x + 3) + ' 42H' + (x + 8) + 'L' + (x + 5) + ' 54H' + x + 'Z"/>'; }).join('') +
  '<path d="M26 84L33 86L30 96L23 94Z M74 84L67 86L70 96L77 94Z" fill="currentColor"/></svg>';
const BRAND = '<div class="brand">' + MARK + '<div class="wm"><b>The Grill</b><small>CAFE</small></div></div>';

const pad = n => String(n).padStart(2, '0');
const fmt = n => Math.floor(Number(n)).toLocaleString('en-IN');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dShort = ts => new Date(ts).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
const dTime = ts => new Date(ts).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

/* ================= campaign rules (shared by mock and server) ================= */
const DBKEY = 'grillcafe-mock-v3', DAY = 86400000;
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const cutoffMs = g => { const [y, m, d] = g.endsAt.split('-').map(Number); return new Date(y, m - 1, d, g.endsHour == null ? 21 : g.endsHour, 0, 0).getTime(); };
const endOfDay = key => { const [y, m, d] = key.split('-').map(Number); return new Date(y, m - 1, d, 23, 59, 59).getTime(); };
const CODECH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const mkCode = () => { let s = 'GRILL-'; for (let i = 0; i < 4; i++) s += CODECH[Math.floor(Math.random() * CODECH.length)]; return s; };
const RULES = { maxPtsPerSec: 48 };
function defaultCampaign() {
  return {
    tiers: [{ points: 10000, slots: 20, prize: 'Free shawarma' }, { points: 20000, slots: 10, prize: '₹200 off' }, { points: 30000, slots: 5, prize: '₹500 off' }],
    grand: { prize: '₹2,000 off', endsAt: dayKey(Date.now() + 30 * DAY), endsHour: 21 },
    daily: { on: false, prize: '₹1,000 off' },
    sceneLen: 1000, safeZone: 500, validDays: 7, validUntil: ''
  };
}
// Cleans an admin-edited campaign. The server runs the same function.
function cleanCampaign(c) {
  const d = defaultCampaign(), n = (v, lo, hi, def) => { v = Math.floor(Number(v)); return isFinite(v) ? Math.max(lo, Math.min(hi, v)) : def; };
  const txt = (v, def) => { v = String(v == null ? '' : v).trim().slice(0, 40); return v || def; };
  const tiers = (Array.isArray(c.tiers) ? c.tiers : []).map(t => ({ points: n(t.points, 100, 1e7, 0), slots: n(t.slots, 0, 100000, 0), prize: txt(t.prize, '') }))
    .filter(t => t.points >= 100 && t.prize).sort((a, b) => a.points - b.points).slice(0, 6);
  const g = c.grand || {}, dl = c.daily || {};
  return {
    tiers: tiers.length ? tiers : d.tiers,

// Returns a reason string when a run looks impossible.
function judgeRun(s, serverSecs) {
  if (!(s.points >= 0) || !(s.secs >= 0)) return 'bad data';
  if (serverSecs != null && s.secs > serverSecs + 5) return 'run longer than the session';
  const secs = Math.max(1, serverSecs != null ? Math.min(serverSecs, s.secs + 5) : s.secs);
  if (s.points / secs > RULES.maxPtsPerSec) return 'points too fast';
  if (s.coins * 5 > s.points + 1) return 'more coins than points';
  return null;
}

    }).join('') + '</tbody></table></div>' +
    '<h3>Recent runs</h3><div class="tw"><table><thead><tr><th>When</th><th>Name</th><th class="n">Points</th><th class="n">Coins</th><th class="n">Time</th><th class="n">Pts/sec</th><th>Check</th></tr></thead><tbody>' +
    d.runs.map(r => '<tr><td>' + dTime(r.ts) + '</td><td>' + esc(r.name || '—') + '</td><td class="n">' + fmt(r.points) + '</td><td class="n">' + fmt(r.coins) + '</td><td class="n">' + Math.floor(r.secs / 60) + 'm ' + pad(r.secs % 60) + 's</td><td class="n">' + (r.secs ? (r.points / r.secs).toFixed(1) : '—') + '</td><td>' +
      (r.flagged ? '<span class="tag warn">' + esc(r.reason || 'flagged') + '</span> <button class="small-btn" data-unflag="' + r.id + '">Approve</button>' : '<span class="tag on">OK</span>') + '</td></tr>').join('') +
    '</tbody></table></div>' +
    sourcesHtml(d.sources) +
    securityHtml(d.security) +
    accountHtml(me, d.users) +
    '<h3>Tools</h3><p>' + (CONFIG.backend === 'server' ? '' : '<button class="small-btn danger" data-act="reset">Reset mock data</button> ') + '<button class="small-btn" data-act="lock">Lock admin</button></p></div>';
}
const EVENT_LABEL = {
  admin_login_fail: 'Wrong admin PIN', admin_locked: 'Admin locked (brute force)', admin_action: 'Admin action', bad_token: 'Wrong device token',
  register_blocked: 'Number takeover blocked', rate_limited: 'Rate limited', cheat_flag: 'Impossible run', prize_won: 'Prize won', banned_access: 'Banned number tried to play'
};
const BAD_EVENTS = ['admin_login_fail', 'admin_locked', 'bad_token', 'register_blocked', 'rate_limited', 'cheat_flag', 'banned_access'];
function securityHtml(sec) {
  if (!sec) return '';
  const det = o => { try { return Object.entries(o || {}).map(([k, v]) => k + ': ' + (typeof v === 'object' ? JSON.stringify(v) : v)).join(', '); } catch (e) { return ''; } };
  const bad = sec.events.filter(e => BAD_EVENTS.includes(e.kind) && e.ts > Date.now() - 864e5).length;
  return '<h3>Security</h3><p class="note">' + (bad ? '<b>' + bad + '</b> suspicious event' + (bad > 1 ? 's' : '') + ' in the last 24 hours.' : 'Nothing suspicious in the last 24 hours.') + ' Every wrong PIN, blocked sign-in, impossible run, prize and admin change is recorded with the address it came from.</p>' +
    '<div class="tedit" style="grid-template-columns:2fr auto auto auto"><label>Mobile number<input id="secPhone" inputmode="numeric" maxlength="10" placeholder="10-digit number"></label>' +
    '<button type="button" class="small-btn danger" data-sec="ban">Ban</button><button type="button" class="small-btn" data-sec="unban">Unban</button>' +
    '<button type="button" class="small-btn" data-sec="reset">Let owner sign in again</button></div>' +
    '<p class="fine">Ban hides the player’s runs, stops them playing and marks their coupons “do not honour”. “Let owner sign in again” is for a real customer who lost their phone: it allows one new sign-in within 24 hours.</p>' +
    (sec.banned.length ? '<h4>Banned</h4><p>' + sec.banned.map(b => esc(b.name) + ' (' + esc(b.phone) + ') <button class="small-btn" data-ban="' + esc(b.phone) + '" data-v="0">Unban</button>').join('<br>') + '</p>' : '') +
    (sec.suspects.length ? '<h4>Players to check (2+ flagged runs, or over 30 points a second)</h4><div class="tw"><table><thead><tr><th>Name</th><th>Mobile</th><th class="n">Flagged</th><th class="n">Fastest pts/s</th><th>Why</th><th>Address</th><th></th></tr></thead><tbody>' +
      sec.suspects.map(x => '<tr><td>' + esc(x.name) + '</td><td>' + esc(x.phone) + '</td><td class="n">' + x.flagged + '</td><td class="n">' + (x.fastest == null ? '—' : x.fastest) + '</td><td>' + esc(x.reasons.join(', ') || '—') + '</td><td>' + esc(x.ip || '—') + '</td><td>' +
        (x.banned ? '<span class="tag warn">Banned</span>' : '<button class="small-btn danger" data-ban="' + esc(x.phone) + '" data-v="1">Ban</button>') + '</td></tr>').join('') + '</tbody></table></div>' : '') +
    (sec.clusters.length ? '<h4>Many numbers from one network (24h). Could be the cafe Wi-Fi, or one person with many numbers</h4><div class="tw"><table><thead><tr><th>Address</th><th class="n">Numbers</th></tr></thead><tbody>' +
      sec.clusters.map(c => '<tr><td>' + esc(c.ip) + '</td><td class="n">' + c.numbers + '</td></tr>').join('') + '</tbody></table></div>' : '') +
    '<h4>Audit log (latest 100)</h4><div class="tw"><table><thead><tr><th>When</th><th>Event</th><th>Mobile</th><th>Address</th><th>Details</th></tr></thead><tbody>' +
    (sec.events.length ? sec.events.map(e => '<tr><td>' + dTime(e.ts) + '</td><td>' + (BAD_EVENTS.includes(e.kind) ? '<span class="tag warn">' : '<span class="tag on">') + esc(EVENT_LABEL[e.kind] || e.kind) + '</span></td><td>' + esc(e.phone || '—') + '</td><td>' + esc(e.ip || '—') + '</td><td>' + esc(det(e.detail)) + '</td></tr>').join('') : '<tr><td colspan="5">No events yet.</td></tr>') +
    '</tbody></table></div>';
}
function sourcesHtml(src) {
  if (!src || !src.length) return '';
  return '<h3>Where players come from</h3><p class="note">Table QR codes and links, counted when someone signs up to play. “direct” means no table or source in the link.</p><div class="tw"><table><thead><tr><th>Table or source</th><th class="n">Players</th><th class="n">Runs</th><th class="n">Prizes won</th></tr></thead><tbody>' +
    src.map(x => '<tr><td>' + esc(x.source) + '</td><td class="n">' + x.players + '</td><td class="n">' + x.runs + '</td><td class="n">' + x.prizes + '</td></tr>').join('') + '</tbody></table></div>';
}
function accountHtml(me, users) {
  let h = '<h3>Accounts</h3><form id="mypin" class="set" style="display:block"><div class="tedit" style="grid-template-columns:2fr auto"><label>Change my PIN (8 or more characters)<input id="newpin" type="password" autocomplete="new-password" minlength="8"></label><button type="button" class="small-btn" data-act="mypin">Change PIN</button></div></form>';
  if (me.role === 'owner' && users && users.length) {
    h += '<div class="tw"><table><thead><tr><th>Username</th><th>Name</th><th>Role</th><th>Last sign-in</th><th></th></tr></thead><tbody>' +
      users.map(u => '<tr><td><b>' + esc(u.username) + '</b></td><td>' + esc(u.display_name) + '</td><td>' + esc(u.role) + '</td><td>' + (u.last_login ? dTime(u.last_login) : 'never') + '</td><td>' +
        (u.username === me.username ? '<span class="tag on">You</span>' : '<button class="small-btn" data-upin="' + esc(u.username) + '">Reset PIN</button> <button class="small-btn' + (u.disabled ? '' : ' danger') + '" data-utoggle="' + esc(u.username) + '" data-v="' + (u.disabled ? '0' : '1') + '">' + (u.disabled ? 'Enable' : 'Disable') + '</button>') + '</td></tr>').join('') +
      '</tbody></table></div><p class="note" id="pinbox" style="font-size:18px"></p>';
  }
  return h;
}
let adminTiers = [];
function readTierRows() {
  return [...adminEl.querySelectorAll('#tlist .tedit')].map(row => ({
    points: Number(row.querySelector('[data-f=points]').value), slots: Number(row.querySelector('[data-f=slots]').value), prize: row.querySelector('[data-f=prize]').value
  }));
}
adminEl.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'pinf') {
    const pin = { u: adminEl.querySelector('#usr').value.trim().toLowerCase(), p: adminEl.querySelector('#pin').value };
    try { await api.adminOverview(pin); setAdminPin(pin); renderAdmin(); }
    catch (er) {
      const pe = adminEl.querySelector('#perr');
      pe.textContent = er.status === 429 ? 'Please try again later.' : 'Wrong username or PIN.'; pe.hidden = false;
    }
  } else if (e.target.id === 'setf') {
    const q = id => adminEl.querySelector(id);
    const config = cleanCampaign({
      tiers: readTierRows(), grand: { prize: q('#gPrize').value, endsAt: q('#gEnd').value, endsHour: q('#gHour').value }, daily: { on: q('#dOn').checked, prize: q('#dPrize').value },
      sceneLen: q('#sScene').value, safeZone: q('#sSafe').value, validDays: q('#sDays').value, validUntil: q('#sUntil').value
    });
    try { await api.adminAction(adminPin, { action: 'config', config }); toast('Settings saved', 1800); } catch (er) { toast('Couldn’t save: ' + er.message, 2500); }
    refreshStats(); renderAdmin();
  }
});
adminEl.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.rm != null) { b.closest('.tedit').remove(); return; }
  if (b.dataset.act === 'addtier') {
    const rows = readTierRows(), lastPts = rows.length ? rows[rows.length - 1].points : 0;
    const div = document.createElement('div');
    div.innerHTML = '<div class="tedit"><label>Points<input data-f="points" type="number" min="100" step="500" value="' + (lastPts + 10000) + '"></label><label>Winners<input data-f="slots" type="number" min="0" value="3"></label><label>Prize<input data-f="prize" maxlength="40" value=""></label><button type="button" class="small-btn" data-rm="x" aria-label="Remove prize level">✕</button></div>';
    adminEl.querySelector('#tlist').appendChild(div.firstChild); return;
  }
  const act = async a => { try { return (await api.adminAction(adminPin, a)) || true; } catch (er) { if (er.auth) { setAdminPin(null); renderAdmin(); } else toast(er.message, 3000); return false; } };
  if (b.dataset.act === 'mypin') {
    const np = adminEl.querySelector('#newpin').value;
    if (np.length < 8) { toast('Use at least 8 characters', 2500); return; }
    if (await act({ action: 'set_pin', pin: np })) { setAdminPin({ u: adminPin.u, p: np }); adminEl.querySelector('#newpin').value = ''; toast('PIN changed', 2200); }
    return;
  }
  if (b.dataset.upin) {
    if (!confirm('Reset the PIN for ' + b.dataset.upin + '? Their old PIN stops working now.')) return;
    const r = await act({ action: 'set_pin', username: b.dataset.upin });
    if (r && r.pin) adminEl.querySelector('#pinbox').textContent = 'New PIN for ' + r.username + ': ' + r.pin + '   (shown once, tell them privately)';
    return;
  }
  if (b.dataset.utoggle) { if (await act({ action: 'disable_user', username: b.dataset.utoggle, value: b.dataset.v === '1' })) renderAdmin(); return; }
  if (b.dataset.sec) {
    const ph = (adminEl.querySelector('#secPhone').value || '').replace(/\D/g, '');
    if (!/^[6-9]\d{9}$/.test(ph)) { toast('Enter the 10-digit mobile number first', 2500); return; }
    if (b.dataset.sec === 'ban' && !confirm('Ban ' + ph + '? Their runs are hidden and their coupons are marked do not honour.')) return;
    const a = b.dataset.sec === 'reset' ? { action: 'reset_player', phone: ph } : { action: 'ban', phone: ph, value: b.dataset.sec === 'ban' };
    if (await act(a)) { toast(b.dataset.sec === 'reset' ? 'Owner can sign in again for 24 hours' : b.dataset.sec === 'ban' ? 'Banned' : 'Unbanned', 2200); renderAdmin(); }
    return;
  }
  if (b.dataset.ban) {
    if (b.dataset.v === '1' && !confirm('Ban ' + b.dataset.ban + '?')) return;
    if (await act({ action: 'ban', phone: b.dataset.ban, value: b.dataset.v === '1' })) renderAdmin();
    return;
  }
  if (b.dataset.code) { if (await act({ action: 'redeem', code: b.dataset.code, value: b.dataset.v === '1' })) renderAdmin(); }
  else if (b.dataset.unflag) { if (await act({ action: 'unflag', id: Number(b.dataset.unflag) })) renderAdmin(); }
  else if (b.dataset.act === 'grand') { if (confirm('Give the top score prize to the current #1 now? This can only happen once.')) { const r = await api.adminAction(adminPin, { action: 'grand' }); if (r && r.ok === false) toast(r.error || 'Not awarded', 2500); renderAdmin(); } }
  else if (b.dataset.act === 'reset') { if (confirm('Reset all mock players, runs and coupons?')) { await api.adminAction(adminPin, { action: 'reset' }); refreshStats(); renderAdmin(); } }
  else if (b.dataset.act === 'lock') { setAdminPin(null); renderAdmin(); }
});
function route() {
  const isAdmin = location.hash === '#admin';
  adminEl.hidden = !isAdmin; paused = isAdmin;
  if (isAdmin) { if (state === 'play') crash(); renderAdmin(); }
  else if (state === 'menu') showMenu();
}
window.addEventListener('hashchange', route);

/* ================= input ================= */
let sw = null;
cv.addEventListener('pointerdown', e => { auInit(); sw = { x: e.clientX, y: e.clientY, id: e.pointerId, done: false }; });
cv.addEventListener('pointermove', e => {
  if (!sw || sw.done || e.pointerId !== sw.id) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 22) { sw.done = true; if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1); else if (dy < 0) jump(); else slide(); }
});
const endSwipe = () => { sw = null; };
cv.addEventListener('pointerup', endSwipe); cv.addEventListener('pointercancel', endSwipe);
$('bJump').addEventListener('pointerdown', e => { e.preventDefault(); auInit(); jump(); });
$('bSlide').addEventListener('pointerdown', e => { e.preventDefault(); auInit(); slide(); });
document.addEventListener('touchmove', e => { if (state === 'play' && !paused) e.preventDefault(); }, { passive: false });
window.addEventListener('keydown', e => {
  if (paused || (e.target && /INPUT|TEXTAREA/.test(e.target.tagName))) return;
  const k = e.key; auInit();
  if (state !== 'play') { if ((k === ' ' || k === 'Enter') && !ov.hidden && canStart && ME && card.dataset.view !== 'finish') { e.preventDefault(); start(); } return; }
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') move(-1);
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') move(1);
  else if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' ') jump();
  else if (k === 'ArrowDown' || k === 's' || k === 'S') slide();
  else return;
  e.preventDefault();
});
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
document.addEventListener('visibilitychange', () => { if (document.hidden && AU.ctx) AU.ctx.suspend(); else if (AU.ctx) AU.ctx.resume(); });

/* ================= loop ================= */
resize();
initWorld();
showMenu();
refreshStats();
route();
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > .05) dt = .05; if (dt < 0) dt = 0;
  if (gfxPref === 'auto' && fpsN < 150 && !paused) {
    fpsAcc += dt; fpsN++;
    if (fpsN === 150) { const hi = fpsAcc / 150 < 1 / 52; if (hi !== tierHigh) { tierHigh = hi; resize(); if (state === 'menu' && card.dataset.view === 'menu') showMenu(); } }
  }
  if (!paused) { t += dt; update(dt); render(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();

</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
